name: Build Firmware

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v1.0-dual-core
            path: firmware/v1.0/dual-core/config.yaml
          - name: v1.0-single-core
            path: firmware/v1.0/single-core/config.yaml
          - name: v2.0-basic
            path: firmware/v2.0/single-core/basic/config.yaml
          - name: v2.0-ds18b20
            path: firmware/v2.0/single-core/ds18b20/config.yaml
          - name: v2.0-ds18b20-radar
            path: firmware/v2.0/single-core/ds18b20-radar/config.yaml

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache ESPHome platform
        uses: actions/cache@v4
        with:
          path: ~/.esphome
          key: esphome-${{ runner.os }}-${{ hashFiles('firmware/**/config.yaml') }}
          restore-keys: esphome-${{ runner.os }}-

      - name: Install ESPHome
        run: pip install esphome

      - name: Compile ${{ matrix.name }}
        run: esphome compile ${{ matrix.path }}

      - name: Collect firmware files
        run: |
          mkdir -p release-assets
          BUILD_DIR=".esphome/build"

          for f in $(find "$BUILD_DIR" -name "firmware*.bin" 2>/dev/null); do
            base=$(basename "$f")
            cp "$f" "release-assets/${{ matrix.name }}.${base}"
          done

          echo "=== Collected ==="
          ls -lh release-assets/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.name }}
          path: release-assets/
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y.%-m.%-d')" >> $GITHUB_OUTPUT

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-firmware
          pattern: firmware-*

      - name: Rename firmware files
        run: |
          mkdir -p final-assets
          find all-firmware -name "*.bin" -exec cp {} final-assets/ \;
          echo "=== Final files ==="
          ls -lh final-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: ${{ steps.date.outputs.date }}
          body: |
            ESP32 PWM Fan Controller firmware ${{ steps.date.outputs.date }}

            **包含固件版本：**
            - v1.0-dual-core — 双核版本
            - v1.0-single-core — 单核版本
            - v2.0-basic — 基础版本
            - v2.0-ds18b20 — DS18B20 温度控制版本
            - v2.0-ds18b20-radar — DS18B20 + 毫米波雷达版本

            **固件文件说明：**
            - `.bin` — 标准固件，用于常规烧录
            - `.factory.bin` — 工厂固件，用于完整恢复出厂
            - `.ota.bin` — OTA 升级固件
          files: final-assets/*.bin
          draft: false
          prerelease: false
          generate_release_notes: true
