name: Build Firmware

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v1.0-dual-core
            path: firmware/v1.0/dual-core/config.yaml
          - name: v1.0-single-core
            path: firmware/v1.0/single-core/config.yaml
          - name: v2.0-basic
            path: firmware/v2.0/single-core/basic/config.yaml
          - name: v2.0-ds18b20
            path: firmware/v2.0/single-core/ds18b20/config.yaml
          - name: v2.0-ds18b20-radar
            path: firmware/v2.0/single-core/ds18b20-radar/config.yaml

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache ESPHome
        uses: actions/cache@v4
        with:
          path: ~/.esphome
          key: esphome-${{ runner.os }}-${{ hashFiles('firmware/**/config.yaml') }}
          restore-keys: esphome-${{ runner.os }}-

      - name: Install ESPHome
        run: pip install esphome

      - name: Compile
        run: esphome compile ${{ matrix.path }}

      - name: Find firmware files
        run: |
          echo "=== ls workspace ==="
          ls -la
          echo "=== find firmware.bin ==="
          find "$GITHUB_WORKSPACE" -name "firmware.bin" 2>/dev/null | head -10
          find / -maxdepth 8 -name "firmware.bin" -not -path "*/cache/*" -not -path "/usr/*" -not -path "/proc/*" -not -path "/sys/*" 2>/dev/null | head -10

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: output/
          if-no-files-found: ignore
          retention-days: 1
