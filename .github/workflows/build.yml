name: Build Firmware

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # English builds (primary)
          - name: v2.0-basic-en
            path: firmware/en/v2.0/dual-core/basic/config.yaml
          - name: v2.0-ds18b20-en
            path: firmware/en/v2.0/dual-core/ds18b20/config.yaml
          - name: v2.0-ds18b20-radar-en
            path: firmware/en/v2.0/dual-core/ds18b20-radar/config.yaml
          # Chinese builds
          - name: v2.0-basic-zh
            path: firmware/zh/v2.0/dual-core/basic/config.yaml
          - name: v2.0-ds18b20-zh
            path: firmware/zh/v2.0/dual-core/ds18b20/config.yaml
          - name: v2.0-ds18b20-radar-zh
            path: firmware/zh/v2.0/dual-core/ds18b20-radar/config.yaml

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache ESPHome
        uses: actions/cache@v4
        with:
          path: ~/.esphome
          key: esphome-${{ runner.os }}-${{ hashFiles('firmware/**/config.yaml') }}
          restore-keys: esphome-${{ runner.os }}-

      - name: Install ESPHome
        run: pip install esphome

      - name: Compile
        run: esphome compile ${{ matrix.path }}

      - name: Collect firmware
        run: |
          SRC_DIR=$(dirname "${{ matrix.path }}")
          mkdir -p output
          echo "Searching in: $SRC_DIR"
          find "$SRC_DIR/.esphome" -name "firmware*.bin" -exec cp {} output/ \;
          cd output
          for f in *.bin; do
            [ -f "$f" ] && mv "$f" "${{ matrix.name }}.$f"
          done
          echo "=== Output ==="
          ls -lh
          [ "$(ls -A)" ] && echo "OK" || (echo "No firmware found" && exit 1)

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: output/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get date
        id: date
        run: echo "tag=$(date +'%Y.%-m.%-d')" >> $GITHUB_OUTPUT

      - name: Verify English and Chinese builds are present
        run: |
          missing=0
          for base in v2.0-basic v2.0-ds18b20 v2.0-ds18b20-radar; do
            for lang in en zh; do
              if [ ! -f "artifacts/${base}-${lang}.firmware.bin" ]; then
                echo "::error::missing ${base}-${lang} firmware"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "English and Chinese firmware present for all 3 variants."

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.tag }}
          name: ${{ steps.date.outputs.tag }}
          body: |
            ESP32 PWM Fan Controller ${{ steps.date.outputs.tag }}

            **Dual-core v2.0 firmware.** All controllers sold after 2026-11-12 use
            the dual-core design, so every v2.0 build is dual-core. The entire v1.0
            line and the single-core builds are archived under `firmware/*/archive/`
            and are no longer published here.

            **Every variant is built in both languages** — English (`-en`, primary)
            and Chinese (`-zh`) — so each release contains 6 builds × 3 file types =
            18 files.

            **Active variants:**

            | Version | English | Chinese |
            |:--------|:--------|:--------|
            | v2.0 Basic | `v2.0-basic-en` | `v2.0-basic-zh` |
            | v2.0 DS18B20 | `v2.0-ds18b20-en` | `v2.0-ds18b20-zh` |
            | v2.0 DS18B20 + radar | `v2.0-ds18b20-radar-en` | `v2.0-ds18b20-radar-zh` |

            **File types:**
            - `.firmware.bin` — standard firmware
            - `.firmware.factory.bin` — factory firmware
            - `.firmware.ota.bin` — OTA upgrade firmware

            **Multiple devices:** the same binary can be flashed to any number of
            devices. The device name automatically appends the local MAC suffix
            (for example `esp32pwm22810-a1b2c3`), so several controllers can be
            added to Home Assistant side by side without overwriting each other.
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
