esphome:
  name: esp32pwm22810
  friendly_name: ESP32 PWM 22810

esp32:
  board: esp32dev
  variant: ESP32 
  framework:
    type: esp-idf
    sdkconfig_options:
    # CONFIG_FREERTOS_UNICORE: "y"，强制单核运行
      CONFIG_ESP_SYSTEM_PANIC_PRINT_REBOOT: "y"

logger:
  level: INFO

api:
  encryption:
    key: "LqGIGJ3qyRc+6X6hsMe5vAms+Jyh2lOMh1FQu8yyuzk="

ota:
  - platform: esphome
    password: "4283bb50a8cd66774ce91d2c9d412cf2"

wifi:
  ap:
    ssid: "ESP32-Fan-22810"
    password: "" 

captive_portal:

esp32_ble_tracker:

bluetooth_proxy:
  active: true

web_server:
  port: 80

output:
  - platform: ledc
    pin: GPIO16
    id: fan1_pwm
    frequency: 25000Hz
  - platform: ledc
    pin: GPIO17
    id: fan2_pwm
    frequency: 25000Hz
  - platform: ledc
    pin: GPIO18
    id: fan3_pwm
    frequency: 25000Hz
  - platform: ledc
    pin: GPIO19
    id: fan4_pwm
    frequency: 25000Hz

switch:
  - platform: gpio
    pin: GPIO21
    id: fan1_pwr
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO22
    id: fan2_pwr
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO23
    id: fan3_pwr
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO13
    id: fan4_pwr
    internal: true
    restore_mode: ALWAYS_OFF

sensor:
  - platform: pulse_counter
    pin:
      number: GPIO32
      mode: INPUT 
    name: "风扇 1 转速"
    id: fan1_rpm
    unit_of_measurement: "RPM"
    update_interval: 4s
    count_mode: {rising_edge: DISABLE, falling_edge: INCREMENT}
    internal_filter: 13us
    filters:
      - multiply: 0.5

  - platform: pulse_counter
    pin:
      number: GPIO33
      mode: INPUT  
    name: "风扇 2 转速"
    id: fan2_rpm
    unit_of_measurement: "RPM"
    update_interval: 4s
    count_mode: {rising_edge: DISABLE, falling_edge: INCREMENT}
    internal_filter: 13us
    filters:
      - multiply: 0.5

  - platform: pulse_counter
    pin:
      number: GPIO25
      mode: INPUT 
    name: "风扇 3 转速"
    id: fan3_rpm
    unit_of_measurement: "RPM"
    update_interval: 4s
    count_mode: {rising_edge: DISABLE, falling_edge: INCREMENT}
    internal_filter: 13us
    filters:
      - multiply: 0.5

  - platform: pulse_counter
    pin:
      number: GPIO26
      mode: INPUT 
    name: "风扇 4 转速"
    id: fan4_rpm
    unit_of_measurement: "RPM"
    update_interval: 4s
    count_mode: {rising_edge: DISABLE, falling_edge: INCREMENT}
    internal_filter: 13us
    filters:
      - multiply: 0.5

  - platform: uptime
    name: "设备运行时间"
    entity_category: "diagnostic"
    id: uptime_sensor
    update_interval: 60s

  - platform: wifi_signal
    name: "Wi-Fi 信号强度"
    entity_category: "diagnostic"
    id: wifi_rssi
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "设备 IP 地址"
        entity_category: "diagnostic"
    ssid:
      name: "连接 Wi-Fi SSID"
        entity_category: "diagnostic"

  - platform: version
    name: "ESPHome 版本"
    entity_category: "diagnostic"

fan:
  - platform: speed
    output: fan1_pwm
    name: "风扇 1"
    speed_count: 100
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - then:
          - switch.turn_on: fan1_pwr
    on_turn_off:
      - then:
          - switch.turn_off: fan1_pwr

  - platform: speed
    output: fan2_pwm
    name: "风扇 2"
    speed_count: 100
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - then:
          - switch.turn_on: fan2_pwr
    on_turn_off:
      - then:
          - switch.turn_off: fan2_pwr

  - platform: speed
    output: fan3_pwm
    name: "风扇 3"
    speed_count: 100
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - then:
          - switch.turn_on: fan3_pwr
    on_turn_off:
      - then:
          - switch.turn_off: fan3_pwr

  - platform: speed
    output: fan4_pwm
    name: "风扇 4"
    speed_count: 100
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - then:
          - switch.turn_on: fan4_pwr
    on_turn_off:
      - then:
          - switch.turn_off: fan4_pwr