esphome:
  name: esp32pwm22810
  friendly_name: ESP32 PWM 22810
  # 上电初始化
  on_boot:
    priority: -100
    then:
      - logger.log: "正在发送激活指令给 LD2402G..."
      - uart.write: [0x55, 0x5A, 0x02, 0x01, 0xAA] 
      - delay: 200ms
      - uart.write: [0x55, 0x01, 0x01, 0x00, 0xAA]

