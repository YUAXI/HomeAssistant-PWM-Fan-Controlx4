# ==========================================
# 24G 毫米波雷达硬件串口及动态调参抗干扰算法
# ==========================================
uart:
  - id: radar_uart
    tx_pin: GPIO5
    rx_pin: GPIO4
    baud_rate: 115200
    debug:
      direction: RX
      dummy_receiver: true
      sequence:
        - lambda: |-
            static std::string line_buffer = "";
            static float last_dist = -1.0f;
            static uint32_t last_change_time = 0;
            
            for (auto val : bytes) {
              if (val == 0x0A) { // 遇到换行符
                int dist_cm = -1;
                if (sscanf(line_buffer.c_str(), "distance:%d", &dist_cm) == 1) {
                  float current_m = dist_cm / 100.0f;
                  
                  // 从 HA 获取用户实时调节的区间限制（单位转成米进行对比）
                  float min_limit = id(radar_min_dist).state;
                  float max_limit = id(radar_max_dist).state;

                  // 【动态抗干扰规则 1】：卡死用户自定义的有效距离区间
                  if (current_m < min_limit || current_m > max_limit) {
                    id(radar_target).publish_state(false);
                    id(radar_dist).publish_state(NAN);
                  } 
                  else {
                    // 【动态抗干扰规则 2】：抗静态震动/数据锁死
                    if (std::abs(current_m - last_dist) > 0.01f) { 
                      last_dist = current_m;
                      last_change_time = millis();
                    }
                    
                    // 如果读数在自定义区间内死卡超过 5 秒，判定为固定伪目标（如无人时的特定反射）
                    if (millis() - last_change_time > 5000) { 
                      id(radar_target).publish_state(false);
                      id(radar_dist).publish_state(NAN);
                    } else {
                      // 合法移动目标
                      id(radar_target).publish_state(true);
                      id(radar_dist).publish_state(current_m);
                    }
                  }
                }
                line_buffer.clear();
              } else if (val != 0x0D) {
                line_buffer += (char)val;
              }
            }

# 1-Wire 单总线
one_wire:
  - platform: gpio
