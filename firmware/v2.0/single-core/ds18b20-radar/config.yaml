# ==========================================
# 定时调速核心控制逻辑
# ==========================================
interval:
  - interval: 5s
    then:
      - lambda: |-
          auto get_temp_by_source = [](std::string source) -> float {
            if (source == "温度 A") return id(temp_a).state;
            if (source == "温度 B") return id(temp_b).state;
            if (source == "温度 C") return id(temp_c).state;
            if (source == "温度 D") return id(temp_d).state;
            return NAN; 
          };

          auto calculate_speed = [](float current_t, float t_min, float t_max, float f_min, float f_max) -> int {
            if (std::isnan(current_t)) return -1; // 传感器异常，返回 -1 表示保持当前风速
            if (current_t <= t_min) return -2;    // 温度低于起控温度，返回 -2 表示断电关停
            if (current_t >= t_max) return (int)f_max;
            float pct = ((current_t - t_min) * (f_max - f_min) / (t_max - t_min) + f_min);
            return (int)roundf(pct);
          };

          std::string s1 = id(f1_source).state;
          if (s1 != "未绑定") {
            float t1 = get_temp_by_source(s1);
            int v1 = calculate_speed(t1, id(f1_t_min).state, id(f1_t_max).state, id(f1_f_min).state, id(f1_f_max).state);
            if (v1 == -2) {
              id(my_fan1).make_call().turn_off().perform(); // 温度过低，断电完全关停
            } else if (v1 >= 0) {
              id(my_fan1).make_call().turn_on().perform();  // 确保风扇处于开启状态
              id(my_fan1).make_call().set_speed(v1).perform();
            }
            // v1 == -1 时不调速，保持当前状态
          }

          std::string s2 = id(f2_source).state;
          if (s2 != "未绑定") {
            float t2 = get_temp_by_source(s2);
            int v2 = calculate_speed(t2, id(f2_t_min).state, id(f2_t_max).state, id(f2_f_min).state, id(f2_f_max).state);
            if (v2 == -2) {
              id(my_fan2).make_call().turn_off().perform();
            } else if (v2 >= 0) {
              id(my_fan2).make_call().turn_on().perform();
              id(my_fan2).make_call().set_speed(v2).perform();
            }
          }

          std::string s3 = id(f3_source).state;
          if (s3 != "未绑定") {
            float t3 = get_temp_by_source(s3);
            int v3 = calculate_speed(t3, id(f3_t_min).state, id(f3_t_max).state, id(f3_f_min).state, id(f3_f_max).state);
            if (v3 == -2) {
              id(my_fan3).make_call().turn_off().perform();
            } else if (v3 >= 0) {
              id(my_fan3).make_call().turn_on().perform();
              id(my_fan3).make_call().set_speed(v3).perform();
            }
          }

          std::string s4 = id(f4_source).state;
          if (s4 != "未绑定") {
            float t4 = get_temp_by_source(s4);
            int v4 = calculate_speed(t4, id(f4_t_min).state, id(f4_t_max).state, id(f4_f_min).state, id(f4_f_max).state);
            if (v4 == -2) {
              id(my_fan4).make_call().turn_off().perform();
            } else if (v4 >= 0) {
              id(my_fan4).make_call().turn_on().perform();
              id(my_fan4).make_call().set_speed(v4).perform();
            }
          }

# ==========================================
# 虚拟雷达有人/无人实体
# ==========================================
binary_sensor:
  - platform: template
    name: "雷达检测到目标 Target"
    id: radar_target

# ==========================================
# 传感器定义
# ==========================================
sensor:
  # 4个温度传感器
  - platform: dallas_temp
    index: 0
    name: "温度 A"
    id: temp_a
    update_interval: 5s

  - platform: dallas_temp
    index: 1
    name: "温度 B"
    id: temp_b
    update_interval: 5s

  - platform: dallas_temp
    index: 2
    name: "温度 C"
    id: temp_c
    update_interval: 5s

  - platform: dallas_temp
    index: 3
    name: "温度 D"
    id: temp_d
    update_interval: 5s

  # 4路测速
  - platform: pulse_counter
    pin:
      number: GPIO32
      mode: INPUT 
    name: "风扇 1 转速"
    id: fan1_rpm
    unit_of_measurement: "RPM"
    update_interval: 4s
    count_mode: {rising_edge: DISABLE, falling_edge: INCREMENT}
    internal_filter: 13us
    filters:
      - multiply: 0.5

  - platform: pulse_counter
    pin:
      number: GPIO33
      mode: INPUT  
    name: "风扇 2 转速"
    id: fan2_rpm
    unit_of_measurement: "RPM"
    update_interval: 4s
    count_mode: {rising_edge: DISABLE, falling_edge: INCREMENT}
    internal_filter: 13us
    filters:
      - multiply: 0.5

  - platform: pulse_counter
    pin:
      number: GPIO25
      mode: INPUT 
    name: "风扇 3 转速"
    id: fan3_rpm
    unit_of_measurement: "RPM"
    update_interval: 4s
    count_mode: {rising_edge: DISABLE, falling_edge: INCREMENT}
    internal_filter: 13us
    filters:
      - multiply: 0.5

  - platform: pulse_counter
    pin:
      number: GPIO26
      mode: INPUT 
    name: "风扇 4 转速"
    id: fan4_rpm
    unit_of_measurement: "RPM"
    update_interval: 4s
    count_mode: {rising_edge: DISABLE, falling_edge: INCREMENT}
    internal_filter: 13us
    filters:
      - multiply: 0.5

  # 虚拟雷达目标距离传感器
  - platform: template
    name: "雷达目标距离 Dist"
    id: radar_dist
    unit_of_measurement: "m"
    icon: "mdi:ruler"

  - platform: uptime
    name: "设备运行时间"
    entity_category: "diagnostic"
    id: uptime_sensor
    update_interval: 60s

  - platform: wifi_signal
    name: "Wi-Fi 信号强度"
    entity_category: "diagnostic"
    id: wifi_rssi
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "设备 IP 地址"
      entity_category: "diagnostic"
    ssid:
      name: "连接 Wi-Fi SSID"
      entity_category: "diagnostic"
  - platform: version
    name: "ESPHome 版本"
    entity_category: "diagnostic"

fan:
  - platform: speed
    output: fan1_pwm
    name: "风扇 1"
    id: my_fan1
    speed_count: 100
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
