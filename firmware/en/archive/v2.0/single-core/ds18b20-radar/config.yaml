# ==========================================
# Periodic speed-control core logic
# ==========================================
interval:
  - interval: 5s
    then:
      - lambda: |-
          auto get_temp_by_source = [](std::string source) -> float {
            if (source == "Temp A") return id(temp_a).state;
            if (source == "Temp B") return id(temp_b).state;
            if (source == "Temp C") return id(temp_c).state;
            if (source == "Temp D") return id(temp_d).state;
            return NAN;
          };

          auto calculate_speed = [](float current_t, float t_min, float t_max, float f_min, float f_max) -> int {
            if (std::isnan(current_t)) return -1; // Sensor failure: keep the current speed
            if (current_t <= t_min) return -2;    // Below the start temperature: cut the power
            if (current_t >= t_max) return (int)f_max;
            float pct = ((current_t - t_min) * (f_max - f_min) / (t_max - t_min) + f_min);
            return (int)roundf(pct);
          };

          std::string s1 = id(f1_source).current_option();
          if (s1 != "Unbound") {
            float t1 = get_temp_by_source(s1);
            int v1 = calculate_speed(t1, id(f1_t_min).state, id(f1_t_max).state, id(f1_f_min).state, id(f1_f_max).state);
            if (v1 == -2) {
              id(my_fan1).make_call().set_state(false).perform();
            } else if (v1 >= 0) {
              id(my_fan1).make_call().set_state(true).perform();
              id(my_fan1).make_call().set_speed(v1).perform();
            }
          }

          std::string s2 = id(f2_source).current_option();
          if (s2 != "Unbound") {
            float t2 = get_temp_by_source(s2);
            int v2 = calculate_speed(t2, id(f2_t_min).state, id(f2_t_max).state, id(f2_f_min).state, id(f2_f_max).state);
            if (v2 == -2) {
              id(my_fan2).make_call().set_state(false).perform();
            } else if (v2 >= 0) {
              id(my_fan2).make_call().set_state(true).perform();
              id(my_fan2).make_call().set_speed(v2).perform();
            }
          }

          std::string s3 = id(f3_source).current_option();
          if (s3 != "Unbound") {
            float t3 = get_temp_by_source(s3);
            int v3 = calculate_speed(t3, id(f3_t_min).state, id(f3_t_max).state, id(f3_f_min).state, id(f3_f_max).state);
            if (v3 == -2) {
              id(my_fan3).make_call().set_state(false).perform();
            } else if (v3 >= 0) {
              id(my_fan3).make_call().set_state(true).perform();
              id(my_fan3).make_call().set_speed(v3).perform();
            }
          }

          std::string s4 = id(f4_source).current_option();
          if (s4 != "Unbound") {
            float t4 = get_temp_by_source(s4);
            int v4 = calculate_speed(t4, id(f4_t_min).state, id(f4_t_max).state, id(f4_f_min).state, id(f4_f_max).state);
            if (v4 == -2) {
              id(my_fan4).make_call().set_state(false).perform();
            } else if (v4 >= 0) {
              id(my_fan4).make_call().set_state(true).perform();
              id(my_fan4).make_call().set_speed(v4).perform();
            }
          }

# ==========================================
# Virtual radar presence entity
# ==========================================
binary_sensor:
  - platform: template
    name: "Radar Target Detected"
    id: radar_target

# ==========================================
# Sensors
# ==========================================
sensor:
  # Four temperature sensors
  - platform: dallas_temp
    index: 0
    name: "Temp A"
    id: temp_a
    update_interval: 5s

  - platform: dallas_temp
    index: 1
    name: "Temp B"
    id: temp_b
    update_interval: 5s

  - platform: dallas_temp
    index: 2
    name: "Temp C"
    id: temp_c
    update_interval: 5s

  - platform: dallas_temp
    index: 3
    name: "Temp D"
    id: temp_d
    update_interval: 5s

  # Four fan tachometer inputs
  - platform: pulse_counter
    pin:
      number: GPIO32
      mode: INPUT
    name: "Fan 1 RPM"
    id: fan1_rpm
    unit_of_measurement: "RPM"
    update_interval: 4s
    count_mode: {rising_edge: DISABLE, falling_edge: INCREMENT}
    internal_filter: 13us
    filters:
      - multiply: 0.5

  - platform: pulse_counter
    pin:
      number: GPIO33
      mode: INPUT
    name: "Fan 2 RPM"
    id: fan2_rpm
    unit_of_measurement: "RPM"
    update_interval: 4s
    count_mode: {rising_edge: DISABLE, falling_edge: INCREMENT}
    internal_filter: 13us
    filters:
      - multiply: 0.5

  - platform: pulse_counter
    pin:
      number: GPIO25
      mode: INPUT
    name: "Fan 3 RPM"
    id: fan3_rpm
    unit_of_measurement: "RPM"
    update_interval: 4s
    count_mode: {rising_edge: DISABLE, falling_edge: INCREMENT}
    internal_filter: 13us
    filters:
      - multiply: 0.5

  - platform: pulse_counter
    pin:
      number: GPIO26
      mode: INPUT
    name: "Fan 4 RPM"
    id: fan4_rpm
    unit_of_measurement: "RPM"
    update_interval: 4s
    count_mode: {rising_edge: DISABLE, falling_edge: INCREMENT}
    internal_filter: 13us
    filters:
      - multiply: 0.5

  # Virtual radar target distance
  - platform: template
    name: "Radar Distance"
    id: radar_dist
    unit_of_measurement: "m"
    icon: "mdi:ruler"

  - platform: uptime
    name: "Uptime"
    entity_category: "diagnostic"
    id: uptime_sensor
    update_interval: 60s

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    entity_category: "diagnostic"
    id: wifi_rssi
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: "diagnostic"
    ssid:
      name: "Wi-Fi SSID"
      entity_category: "diagnostic"

  - platform: version
    name: "ESPHome Version"
    entity_category: "diagnostic"

fan:
  - platform: speed
    output: fan1_pwm
    name: "Fan 1"
    id: my_fan1
    speed_count: 100
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - then:
          - switch.turn_on: fan1_pwr
    on_turn_off:
      - then:
          - switch.turn_off: fan1_pwr

  - platform: speed
