esphome:
  name: esp32pwm22810
  # Append the local MAC suffix so the same firmware flashed to several devices
  # gets a unique name (for example esp32pwm22810-a1b2c3).
  name_add_mac_suffix: true
  friendly_name: ESP32 PWM 22810
  # Boot sequence: activate the LD2402G radar
  on_boot:
    priority: -100
    then:
      - logger.log: "Sending activation command to LD2402G..."
      - uart.write: [0x55, 0x5A, 0x02, 0x01, 0xAA]
      - delay: 200ms
      - uart.write: [0x55, 0x01, 0x01, 0x00, 0xAA]

esp32:
  board: esp32dev
  variant: ESP32
  framework:
    type: esp-idf
    sdkconfig_options:
      # Keep FreeRTOS on a single core. Safe on dual-core boards as well, and
      # required by the single-core controller hardware.
      CONFIG_FREERTOS_UNICORE: "y"
      CONFIG_ESP_SYSTEM_PANIC_PRINT_REBOOT: "y"

logger:
  level: INFO

api:
  encryption:
    key: "LqGIGJ3qyRc+6X6hsMe5vAms+Jyh2lOMh1FQu8yyuzk="

ota:
  - platform: esphome
    password: "4283bb50a8cd66774ce91d2c9d412cf2"

wifi:
