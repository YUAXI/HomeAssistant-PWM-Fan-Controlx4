# ==========================================
# 24 GHz mmWave radar UART and anti-interference parsing
# ==========================================
uart:
  - id: radar_uart
    tx_pin: GPIO5
    rx_pin: GPIO4
    baud_rate: 115200
    debug:
      direction: RX
      dummy_receiver: true
      sequence:
        - lambda: |-
            static std::string line_buffer = "";
            static float last_dist = -1.0f;
            static uint32_t last_change_time = 0;

            for (auto val : bytes) {
              if (val == 0x0A) { // End of line
                int dist_cm = -1;
                if (sscanf(line_buffer.c_str(), "distance:%d", &dist_cm) == 1) {
                  float current_m = dist_cm / 100.0f;

                  // Distance window configured from Home Assistant (metres)
                  float min_limit = id(radar_min_dist).state;
                  float max_limit = id(radar_max_dist).state;

                  // Anti-interference rule 1: stay inside the configured window
                  if (current_m < min_limit || current_m > max_limit) {
                    id(radar_target).publish_state(false);
                    id(radar_dist).publish_state(NAN);
                  }
                  else {
                    // Anti-interference rule 2: reject static / frozen readings
                    if (std::abs(current_m - last_dist) > 0.01f) {
                      last_dist = current_m;
                      last_change_time = millis();
                    }

                    // A reading frozen inside the window for more than 5 seconds
                    // is treated as a fixed false target (e.g. a static reflector)
                    if (millis() - last_change_time > 5000) {
                      id(radar_target).publish_state(false);
                      id(radar_dist).publish_state(NAN);
                    } else {
                      // Valid moving target
                      id(radar_target).publish_state(true);
                      id(radar_dist).publish_state(current_m);
                    }
                  }
                }
                line_buffer.clear();
              } else if (val != 0x0D) {
                line_buffer += (char)val;
              }
            }

# 1-Wire bus for the DS18B20 temperature sensors
one_wire:
  - platform: gpio
    pin: GPIO14

output:
  - platform: ledc
    pin: GPIO16
    id: fan1_pwm
    frequency: 25000Hz
  - platform: ledc
    pin: GPIO17
    id: fan2_pwm
    frequency: 25000Hz
  - platform: ledc
    pin: GPIO18
    id: fan3_pwm
    frequency: 25000Hz
  - platform: ledc
    pin: GPIO19
    id: fan4_pwm
    frequency: 25000Hz

switch:
  - platform: gpio
    pin: GPIO21
    id: fan1_pwr
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO22
    id: fan2_pwr
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO23
    id: fan3_pwr
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO13
    id: fan4_pwr
    internal: true
    restore_mode: ALWAYS_OFF

